name: Code Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install radon pylint pytest coverage
      - name: Radon cyclomatic complexity
        run: |
          radon cc analytics.py -s -a
          radon mi analytics.py -s
      - name: Pylint
        run: pylint analytics.py --score=y --exit-zero
      - name: Regression tests and coverage
        run: |
          coverage run --branch -m pytest -q test_analytics.py
          coverage report -m analytics.py
